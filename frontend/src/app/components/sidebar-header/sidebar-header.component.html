<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <p class="app-name">BookCourt</p>

      <h1>{{ dashboardTitle }}</h1>

      @if (roleLabel) {
        <p class="role-label">
          {{ roleLabel }}
        </p>
      }
    </div>

    <nav class="sidebar-nav" aria-label="Menu dashboard">
      @for (item of sidebarItems; track trackByKey($index, item)) {
        <button
          type="button"
          class="sidebar-link"
          [class.active]="isSidebarItemActive(item)"
          (click)="selectMenuItem(item)"
        >
          <span class="material-symbols-outlined">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </button>
      }
    </nav>

    <div class="sidebar-footer">
      <button type="button" class="logout-button" (click)="logout()">
        <span class="material-symbols-outlined">logout</span>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <section class="dashboard-main">
    <header class="topbar">
      @if (canViewStaffHeaderNav) {
        <nav class="topbar-nav" aria-label="Sezioni staff">
          <button
            type="button"
            class="topbar-nav-link"
            [class.active]="isInstructorsActive()"
            [attr.aria-current]="isInstructorsActive() ? 'page' : null"
            (click)="openInstructors()"
          >
            Istruttori
          </button>
          <button
            type="button"
            class="topbar-nav-link"
            [class.active]="isSecretariesActive()"
            [attr.aria-current]="isSecretariesActive() ? 'page' : null"
            (click)="openSecretaries()"
          >
            Segretarie
          </button>
          <button
            type="button"
            class="topbar-nav-link"
            [class.active]="isFieldsActive()"
            [attr.aria-current]="isFieldsActive() ? 'page' : null"
            (click)="openFields()"
          >
            Campi
          </button>
        </nav>
      }

      <div class="profile-summary">
        <div class="profile-text">
          <strong>{{ fullName }}</strong>

          @if (hasActiveBookingLock()) {
            <span class="booking-lock-timer">
              <span class="material-symbols-outlined">timer</span>
              {{ bookingLockRemainingLabel() }} per completare
            </span>
          }
        </div>

        <button type="button" class="profile-button" aria-label="Profilo utente">
          @if (profileImageUrl) {
            <img [src]="profileImageUrl" [alt]="fullName" (error)="onProfileImageError()" />
          }

          @if (!profileImageUrl) {
            <span class="profile-initials">
              {{ userInitials }}
            </span>
          }
        </button>
      </div>
    </header>

    <router-outlet></router-outlet>
  </section>
</div>
