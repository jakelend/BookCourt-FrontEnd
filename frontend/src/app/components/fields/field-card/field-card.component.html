<article
  class="instructor-card"
  [class.selection-card]="isSelectionMode"
  [class.selection-disabled]="isSelectionMode && !field.attivo"
  [attr.role]="isSelectionMode ? 'button' : null"
  [attr.tabindex]="isSelectionMode && field.attivo ? 0 : null"
  (click)="select()"
  (keydown)="onCardKeydown($event)"
>
  <div class="card-media">
    <img *ngIf="coverImageUrl" [src]="coverImageUrl" [alt]="field.nome" />

    <div *ngIf="!coverImageUrl" class="field-image-placeholder">
      <span class="material-symbols-outlined">stadium</span>
    </div>

    <div class="media-overlay"></div>

    <div class="media-title">
      <h3>{{ field.nome }}</h3>
      <p>{{ field.sport }}</p>
    </div>
  </div>

  <div class="card-body">
    <div class="status-row">
      <span class="status-pill" [class.status-muted]="!field.attivo">
        {{ statusLabel }}
      </span>
    </div>

    <div class="rates-panel" [class.rates-muted]="!field.attivo">
      <div class="rate-row">
        <div class="rate-name">
          <span class="material-symbols-outlined">sports_soccer</span>
          <span>Sport</span>
        </div>
        <strong>{{ field.sport }}</strong>
      </div>

      <div class="rate-divider"></div>

      <div class="rate-row">
        <div class="rate-name">
          <span class="material-symbols-outlined">payments</span>
          <span>Tariffa</span>
        </div>
        <strong>{{ hourlyRateLabel }}</strong>
      </div>
    </div>

    <button
      *ngIf="isSelectionMode"
      type="button"
      class="selection-button"
      [disabled]="!field.attivo"
      (click)="select()"
    >
      Seleziona campo
    </button>

    <div *ngIf="!isSelectionMode" class="active-row">
      <span>{{ field.attivo ? 'Attivo' : 'Inattivo' }}</span>

      <label class="switch">
        <input
          type="checkbox"
          [checked]="field.attivo"
          [disabled]="togglePending"
          (change)="toggleActive($event)"
        />
        <span></span>
      </label>
    </div>
  </div>

  <button
    *ngIf="!isSelectionMode"
    type="button"
    class="edit-button"
    aria-label="Modifica campo"
    (click)="edit($event)"
  >
    <span class="material-symbols-outlined">edit</span>
  </button>
</article>
