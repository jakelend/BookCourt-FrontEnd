<article class="instructor-card">
  <div class="card-media">
    <img *ngIf="coverImageUrl" [src]="coverImageUrl" [alt]="field.name" />
    <div *ngIf="!coverImageUrl" class="field-image-placeholder">
      <span class="material-symbols-outlined">stadium</span>
    </div>
    <div class="media-overlay"></div>

    <div class="media-title">
      <h3>{{ field.name }}</h3>
      <p>{{ field.sportType }}</p>
    </div>
  </div>

  <div class="card-body">
    <div class="status-row">
      <span class="status-pill" [class.status-muted]="!field.active">
        {{ statusLabel }}
      </span>
    </div>

    <div class="rates-panel" [class.rates-muted]="!field.active">
      <div class="rate-row">
        <div class="rate-name">
          <span class="material-symbols-outlined">sports_soccer</span>
          <span>Sport</span>
        </div>
        <strong>{{ field.sportType }}</strong>
      </div>

      <div class="rate-divider"></div>

      <div class="rate-row">
        <div class="rate-name">
          <span class="material-symbols-outlined">payments</span>
          <span>Tariffa</span>
        </div>
        <strong>EUR {{ field.hourlyRate }}/h</strong>
      </div>
    </div>

    <div class="active-row">
      <span>{{ field.active ? 'Attivo' : 'Inattivo' }}</span>
      <label class="switch">
        <input type="checkbox" [checked]="field.active" (change)="toggleActive($event)" />
        <span></span>
      </label>
    </div>
  </div>

  <button type="button" class="edit-button" aria-label="Modifica campo" (click)="edit()">
    <span class="material-symbols-outlined">edit</span>
  </button>
</article>
