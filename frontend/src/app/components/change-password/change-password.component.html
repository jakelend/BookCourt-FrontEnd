<main class="change-password-page">
  <section class="change-password-panel">
    <header class="form-panel-header">
      <span class="section-eyebrow">Sicurezza account</span>
      <h1>Cambia password</h1>
      <p>Aggiorna la password usando quella attuale e confermando la nuova.</p>
    </header>

    <form
      class="change-password-form"
      [formGroup]="changePasswordForm"
      (ngSubmit)="onSubmit()"
      novalidate
    >
      <label class="form-field">
        <span>Password attuale</span>
        <div class="password-field-wrapper">
          <input
            [type]="showCurrentPassword ? 'text' : 'password'"
            formControlName="currentPassword"
            autocomplete="current-password"
            placeholder="Password attuale"
          />
          <button
            type="button"
            class="password-toggle-button"
            [attr.aria-label]="showCurrentPassword ? 'Nascondi password attuale' : 'Mostra password attuale'"
            (click)="toggleCurrentPasswordVisibility()"
          >
            <span class="material-symbols-outlined">{{ showCurrentPassword ? 'visibility' : 'visibility_off' }}</span>
          </button>
        </div>
        <small
          *ngIf="(submitted || currentPassword?.touched) && currentPassword?.errors?.['required']"
        >
          Inserisci la password attuale.
        </small>
      </label>

      <label class="form-field">
        <span>Nuova password</span>
        <div class="password-field-wrapper">
          <input
            [type]="showNewPassword ? 'text' : 'password'"
            formControlName="newPassword"
            autocomplete="new-password"
            placeholder="Nuova password"
          />
          <button
            type="button"
            class="password-toggle-button"
            [attr.aria-label]="showNewPassword ? 'Nascondi nuova password' : 'Mostra nuova password'"
            (click)="toggleNewPasswordVisibility()"
          >
            <span class="material-symbols-outlined">{{ showNewPassword ? 'visibility' : 'visibility_off' }}</span>
          </button>
        </div>
        <small *ngIf="(submitted || newPassword?.touched) && newPassword?.errors?.['required']">
          Inserisci la nuova password.
        </small>
        <small *ngIf="(submitted || newPassword?.touched) && newPassword?.errors?.['minlength']">
          La nuova password deve avere almeno 6 caratteri.
        </small>
      </label>

      <label class="form-field">
        <span>Conferma nuova password</span>
        <div class="password-field-wrapper">
          <input
            [type]="showConfirmNewPassword ? 'text' : 'password'"
            formControlName="confirmNewPassword"
            autocomplete="new-password"
            placeholder="Conferma nuova password"
          />
          <button
            type="button"
            class="password-toggle-button"
            [attr.aria-label]="showConfirmNewPassword ? 'Nascondi conferma password' : 'Mostra conferma password'"
            (click)="toggleConfirmNewPasswordVisibility()"
          >
            <span class="material-symbols-outlined">{{ showConfirmNewPassword ? 'visibility' : 'visibility_off' }}</span>
          </button>
        </div>
        <small
          *ngIf="
            (submitted || confirmNewPassword?.touched) &&
            confirmNewPassword?.errors?.['required']
          "
        >
          Conferma la nuova password.
        </small>
        <small
          *ngIf="
            (submitted || confirmNewPassword?.touched) &&
            changePasswordForm.errors?.['passwordsMismatch']
          "
        >
          Le password non coincidono.
        </small>
      </label>

      <div *ngIf="changePasswordError" class="form-message error-message">
        {{ changePasswordError }}
      </div>

      <div *ngIf="changePasswordSuccess" class="form-message success-message">
        {{ changePasswordSuccess }}
      </div>

      <div class="form-actions">
        <button
          type="submit"
          class="primary-action"
          [disabled]="changePasswordForm.invalid || isLoading"
        >
          {{ isLoading ? 'Salvataggio...' : 'Cambia password' }}
        </button>
      </div>
    </form>
  </section>
</main>
