<main class="change-password-page">
  <section class="change-password-panel">
    <header class="form-panel-header">
      <span class="section-eyebrow">Sicurezza account</span>
      <h1>Cambia password</h1>
      <p>Aggiorna la password usando quella attuale e confermando la nuova.</p>
    </header>

    <form
      class="change-password-form"
      [formGroup]="changePasswordForm"
      (ngSubmit)="onSubmit()"
      novalidate
    >
      <!-- Tengo separati password attuale, nuova e conferma:
      cosi il controllo e piu chiaro sia lato frontend sia lato backend. -->
      <label class="form-field">
        <span>Password attuale</span>
        <div class="password-field-wrapper">
          <input
            [type]="showCurrentPassword ? 'text' : 'password'"
            formControlName="currentPassword"
            autocomplete="current-password"
            placeholder="Password attuale"
          />
          <button
            type="button"
            class="password-toggle-button"
            [attr.aria-label]="
              showCurrentPassword ? 'Nascondi password attuale' : 'Mostra password attuale'
            "
            (click)="toggleCurrentPasswordVisibility()"
          >
            <span class="material-symbols-outlined">{{
              showCurrentPassword ? 'visibility' : 'visibility_off'
            }}</span>
          </button>
        </div>
        @if ((submitted || currentPassword?.touched) && currentPassword?.errors?.['required']) {
          <small> Inserisci la password attuale. </small>
        }
      </label>

      <label class="form-field">
        <span>Nuova password</span>
        <div class="password-field-wrapper">
          <input
            [type]="showNewPassword ? 'text' : 'password'"
            formControlName="newPassword"
            autocomplete="new-password"
            placeholder="Nuova password"
          />
          <button
            type="button"
            class="password-toggle-button"
            [attr.aria-label]="
              showNewPassword ? 'Nascondi nuova password' : 'Mostra nuova password'
            "
            (click)="toggleNewPasswordVisibility()"
          >
            <span class="material-symbols-outlined">{{
              showNewPassword ? 'visibility' : 'visibility_off'
            }}</span>
          </button>
        </div>
        @if ((submitted || newPassword?.touched) && newPassword?.errors?.['required']) {
          <small> Inserisci la nuova password. </small>
        }
        @if ((submitted || newPassword?.touched) && newPassword?.errors?.['minlength']) {
          <small> La nuova password deve avere almeno 6 caratteri. </small>
        }
      </label>

      <label class="form-field">
        <span>Conferma nuova password</span>
        <div class="password-field-wrapper">
          <input
            [type]="showConfirmNewPassword ? 'text' : 'password'"
            formControlName="confirmNewPassword"
            autocomplete="new-password"
            placeholder="Conferma nuova password"
          />
          <button
            type="button"
            class="password-toggle-button"
            [attr.aria-label]="
              showConfirmNewPassword ? 'Nascondi conferma password' : 'Mostra conferma password'
            "
            (click)="toggleConfirmNewPasswordVisibility()"
          >
            <span class="material-symbols-outlined">{{
              showConfirmNewPassword ? 'visibility' : 'visibility_off'
            }}</span>
          </button>
        </div>
        @if (
          (submitted || confirmNewPassword?.touched) && confirmNewPassword?.errors?.['required']
        ) {
          <small> Conferma la nuova password. </small>
        }
        @if (
          (submitted || confirmNewPassword?.touched) &&
          changePasswordForm.errors?.['passwordsMismatch']
        ) {
          <small> Le password non coincidono. </small>
        }
      </label>

      <!-- Qui metto i messaggi generali del form,
      non quelli dei singoli campi. -->
      @if (changePasswordError) {
        <div class="form-message error-message">
          {{ changePasswordError }}
        </div>
      }

      @if (changePasswordSuccess) {
        <div class="form-message success-message">
          {{ changePasswordSuccess }}
        </div>
      }

      <div class="form-actions">
        <!-- Il submit parte solo se il form va bene
        e non c'e gia una richiesta aperta. -->
        <button
          type="submit"
          class="primary-action"
          [disabled]="changePasswordForm.invalid || isLoading"
        >
          {{ isLoading ? 'Salvataggio...' : 'Cambia password' }}
        </button>
      </div>
    </form>
  </section>
</main>
