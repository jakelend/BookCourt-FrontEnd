<article class="instructor-card">
  <!--
    Parte grafica della card:
    - se imageUrl esiste provo a mostrare la foto profilo;
    - se manca o fallisce, il template usa le iniziali come fallback.
  -->
  <div class="card-media">
    @if (imageUrl) {
      <img [src]="imageUrl" [alt]="fullName" (error)="onImageError()" />
    } @else {
      <div class="profile-initials-placeholder" aria-label="Iniziali segretaria">
        {{ initials }}
      </div>
    }

    <div class="media-overlay"></div>

    <div class="media-title">
      <h3>{{ fullName }}</h3>
    </div>
  </div>

  <div class="card-body">
    <!--
      [class.status-muted] cambia solo lo stile visivo quando la segretaria non e' attiva.
      Quindi il template non cambia i dati, cambia il modo in cui li fa vedere.
    -->
    <div class="status-row">
      <span class="status-pill" [class.status-muted]="!secretary.attivo">
        {{ statusLabel }}
      </span>
    </div>

    <div class="rates-panel" [class.rates-muted]="!secretary.attivo">
      <div class="rate-row">
        <div class="rate-name">
          <span class="material-symbols-outlined">mail</span>
          <span>Email</span>
        </div>
        <strong>{{ secretary.email }}</strong>
      </div>

      <div class="rate-divider"></div>

      <div class="rate-row">
        <div class="rate-name">
          <span class="material-symbols-outlined">call</span>
          <span>Telefono</span>
        </div>
        <strong>{{ secretary.telefono }}</strong>
      </div>
    </div>

    <!--
      Questo toggle mostra e modifica lo stato attivo/inattivo.
      [checked] legge il valore attuale dal model, mentre (change) inoltra al padre la richiesta di modifica.
    -->
    <div class="active-row">
      <span>{{ secretary.attivo ? 'Attivo' : 'Inattivo' }}</span>
      <label class="switch">
        <input type="checkbox" [checked]="secretary.attivo" (change)="toggleActive($event)" />
        <span></span>
      </label>
    </div>
  </div>

  <button type="button" class="edit-button" aria-label="Modifica segretaria" (click)="edit()">
    <span class="material-symbols-outlined">edit</span>
  </button>
</article>
