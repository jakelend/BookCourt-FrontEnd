<article class="instructor-card">
  <div class="card-media">
    <img [src]="secretary.imageUrl" [alt]="secretary.fullName" />
    <div class="media-overlay"></div>

    <div class="media-title">
      <h3>{{ secretary.fullName }}</h3>
    </div>
  </div>

  <div class="card-body">
    <div class="status-row">
      <span class="status-pill" [class.status-muted]="!secretary.active">
        {{ secretary.status }}
      </span>
    </div>

    <div class="rates-panel" [class.rates-muted]="!secretary.active">
      <div class="rate-row">
        <div class="rate-name">
          <span class="material-symbols-outlined">mail</span>
          <span>Email</span>
        </div>
        <strong>{{ secretary.email }}</strong>
      </div>

      <div class="rate-divider"></div>

      <div class="rate-row">
        <div class="rate-name">
          <span class="material-symbols-outlined">call</span>
          <span>Telefono</span>
        </div>
        <strong>{{ secretary.phone }}</strong>
      </div>
    </div>

    <div class="active-row">
      <span>{{ secretary.active ? 'Attivo' : 'Inattivo' }}</span>
      <label class="switch">
        <input type="checkbox" [checked]="secretary.active" (change)="toggleActive($event)" />
        <span></span>
      </label>
    </div>
  </div>

  <button
    type="button"
    class="edit-button"
    aria-label="Modifica segretaria"
    (click)="edit()"
  >
    <span class="material-symbols-outlined">edit</span>
  </button>
</article>
