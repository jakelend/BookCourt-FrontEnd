<main class="instructors-page">
  <header class="page-header">
    <div>
      <h1>Segretarie</h1>
      <p>Gestisci lo staff di reception e supporto al centro.</p>
    </div>

    <button type="button" class="add-instructor-button" (click)="addSecretary()">
      <span class="material-symbols-outlined">add</span>
      <span>Aggiungi segretaria</span>
    </button>
  </header>

  <section class="instructors-grid" aria-label="Lista segretarie">
    <app-secretary-card
      *ngFor="let secretary of secretaries; trackBy: trackBySecretaryId"
      [secretary]="secretary"
      (editSecretary)="modifySecretary($event)"
    />
  </section>
</main>
