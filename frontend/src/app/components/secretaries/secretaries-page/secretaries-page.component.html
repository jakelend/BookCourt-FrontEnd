<main class="instructors-page">
  <header class="page-header">
    <div>
      <h1>Segretarie</h1>
      <p>Gestisci lo staff di reception e supporto al centro.</p>
    </div>

    <button type="button" class="add-instructor-button" (click)="addSecretary()">
      <span class="material-symbols-outlined">add</span>
      <span>Aggiungi segretaria</span>
    </button>
  </header>

  <section *ngIf="loading" class="feedback-panel" aria-live="polite">
    <span class="material-symbols-outlined">progress_activity</span>
    <span>Caricamento segretarie...</span>
  </section>

  <section *ngIf="!loading && errorMessage" class="feedback-panel feedback-panel-error" aria-live="assertive">
    <div>
      <strong>Errore caricamento</strong>
      <p>{{ errorMessage }}</p>
    </div>

    <button type="button" class="retry-button" (click)="retry()">Riprova</button>
  </section>

  <section *ngIf="!loading && toggleError" class="feedback-panel feedback-panel-error" aria-live="assertive">
    <div>
      <strong>Operazione non riuscita</strong>
      <p>{{ toggleError }}</p>
    </div>
  </section>

  <section *ngIf="!loading && !errorMessage && !secretaries.length" class="feedback-panel" aria-live="polite">
    <span class="material-symbols-outlined">groups</span>
    <span>Nessuna segretaria presente.</span>
  </section>

  <section *ngIf="!loading && !errorMessage && secretaries.length" class="instructors-grid" aria-label="Lista segretarie">
    <app-secretary-card
      *ngFor="let secretary of secretaries; trackBy: trackBySecretaryId"
      [secretary]="secretary"
      [togglePending]="isToggling(secretary.id)"
      (editSecretary)="modifySecretary($event)"
      (toggleSecretary)="onToggleSecretary($event)"
    />
  </section>
</main>
