<div class="auth-page">
  <main class="auth-card auth-card-small reset-card">
    <div class="card-accent"></div>

    <header class="auth-header reset-header">
      <div class="round-icon">
        <span class="material-symbols-outlined">password</span>
      </div>

      <h1>Reimposta Password</h1>

      <p>Scegli una nuova password sicura per proteggere il tuo account.</p>
    </header>

    <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" novalidate class="auth-form">
      <div class="form-field">
        <label for="nuovaPassword">Nuova Password</label>

        <div class="input-wrapper has-password-toggle">
          <input
            id="nuovaPassword"
            [type]="showNewPassword ? 'text' : 'password'"
            formControlName="nuovaPassword"
            autocomplete="new-password"
            placeholder="••••••••"
          />
          <span class="material-symbols-outlined input-icon">lock</span>
          <button
            type="button"
            class="password-toggle-button"
            [attr.aria-label]="showNewPassword ? 'Nascondi nuova password' : 'Mostra nuova password'"
            (click)="toggleNewPasswordVisibility()"
          >
            <span class="material-symbols-outlined">{{ showNewPassword ? 'visibility' : 'visibility_off' }}</span>
          </button>
        </div>

        <p *ngIf="(submitted || nuovaPassword?.touched) && nuovaPassword?.errors?.['required']" class="field-error">
          Inserisci la nuova password.
        </p>

        <p *ngIf="(submitted || nuovaPassword?.touched) && nuovaPassword?.errors?.['minlength']" class="field-error">
          La password deve avere almeno 6 caratteri.
        </p>
      </div>

      <div class="form-field">
        <label for="confermaNuovaPassword">Ripeti Nuova Password</label>

        <div class="input-wrapper has-password-toggle">
          <input
            id="confermaNuovaPassword"
            [type]="showConfirmNewPassword ? 'text' : 'password'"
            formControlName="confermaNuovaPassword"
            autocomplete="new-password"
            placeholder="••••••••"
          />
          <span class="material-symbols-outlined input-icon">lock_reset</span>
          <button
            type="button"
            class="password-toggle-button"
            [attr.aria-label]="showConfirmNewPassword ? 'Nascondi conferma password' : 'Mostra conferma password'"
            (click)="toggleConfirmNewPasswordVisibility()"
          >
            <span class="material-symbols-outlined">{{ showConfirmNewPassword ? 'visibility' : 'visibility_off' }}</span>
          </button>
        </div>

        <p
          *ngIf="(submitted || confermaNuovaPassword?.touched) && confermaNuovaPassword?.errors?.['required']"
          class="field-error"
        >
          Ripeti la nuova password.
        </p>

        <p
          *ngIf="(submitted || confermaNuovaPassword?.touched) && resetPasswordForm.errors?.['passwordsMismatch']"
          class="field-error"
        >
          Le password non coincidono.
        </p>
      </div>

      <div *ngIf="resetPasswordError" class="form-message error-message">
        {{ resetPasswordError }}
      </div>

      <div *ngIf="resetPasswordSuccess" class="form-message success-message">
        {{ resetPasswordSuccess }}
      </div>

      <button type="submit" class="primary-button" [disabled]="resetPasswordForm.invalid || isLoading || !token">
        <span *ngIf="!isLoading">Cambia Password</span>
        <span *ngIf="isLoading">Modifica in corso...</span>
      </button>
    </form>

    <div class="back-link-wrapper">
      <button type="button" class="back-link" (click)="onLogin()">
        <span class="material-symbols-outlined">arrow_back</span>
        Torna al Login
      </button>
    </div>
  </main>
</div>
