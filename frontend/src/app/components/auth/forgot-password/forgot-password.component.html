<div class="auth-page">
  <main class="auth-card auth-card-small">
    <header class="auth-header forgot-header">
      <div class="round-icon">
        <span class="material-symbols-outlined">mail</span>
      </div>

      <h1>Recupera Password</h1>

      <p>Inserisci il tuo indirizzo email. Ti invieremo un link per creare una nuova password.</p>
    </header>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" novalidate class="auth-form">
      <div class="form-field">
        <label for="email">Indirizzo Email</label>

        <div class="input-wrapper">
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="nome@esempio.com"
          />
          <span class="material-symbols-outlined input-icon">mail</span>
        </div>

        <p *ngIf="(submitted || email?.touched) && email?.errors?.['required']" class="field-error">
          Inserisci l'indirizzo email.
        </p>

        <p *ngIf="(submitted || email?.touched) && email?.errors?.['email']" class="field-error">
          Inserisci un indirizzo email valido.
        </p>
      </div>

      <div *ngIf="recoveryError" class="form-message error-message">
        {{ recoveryError }}
      </div>

      <div *ngIf="recoverySuccess" class="form-message success-message">
        {{ recoverySuccess }}
      </div>

      <button type="submit" class="primary-button" [disabled]="forgotPasswordForm.invalid || isLoading">
        <span *ngIf="!isLoading">Invia Email di Recupero</span>
        <span *ngIf="isLoading">Invio in corso...</span>
      </button>
    </form>

    <div class="back-link-wrapper">
      <button type="button" class="back-link" (click)="onLogin()">
        <span class="material-symbols-outlined">arrow_back</span>
        Torna al Login
      </button>
    </div>
  </main>
</div>
