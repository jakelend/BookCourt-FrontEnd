<article class="instructor-card">
  <div class="card-media">
    <img
      *ngIf="imageUrl; else instructorInitials"
      [src]="imageUrl"
      [alt]="fullName"
      (error)="onImageError()"
    />

    <ng-template #instructorInitials>
      <div class="profile-initials-placeholder" aria-label="Iniziali istruttore">
        {{ initials }}
      </div>
    </ng-template>
    <div class="media-overlay"></div>

    <div class="media-title">
      <h3>{{ fullName }}</h3>
    </div>
  </div>

  <div class="card-body">
    <div class="status-row">
      <span class="status-pill" [class.status-muted]="!instructor.attivo">
        {{ statusLabel }}
      </span>
    </div>

    <div class="rates-panel" [class.rates-muted]="!instructor.attivo">
      <div class="rate-row">
        <div class="rate-name">
          <span class="material-symbols-outlined">sports_tennis</span>
          <span>Tennis</span>
        </div>
        <strong>{{ tennisRateLabel }}</strong>
      </div>

      <div class="rate-divider"></div>

      <div class="rate-row">
        <div class="rate-name">
          <span class="material-symbols-outlined">sports_score</span>
          <span>Padel</span>
        </div>
        <strong>{{ padelRateLabel }}</strong>
      </div>
    </div>

    <div class="active-row">
      <span>{{ instructor.attivo ? 'Attivo' : 'Inattivo' }}</span>
      <label class="switch">
        <input
          type="checkbox"
          [checked]="instructor.attivo"
          (change)="toggleActive($event)"
        />
        <span></span>
      </label>
    </div>
  </div>

  <button
    type="button"
    class="edit-button"
    aria-label="Modifica istruttore"
    (click)="edit()"
  >
    <span class="material-symbols-outlined">edit</span>
  </button>
</article>
