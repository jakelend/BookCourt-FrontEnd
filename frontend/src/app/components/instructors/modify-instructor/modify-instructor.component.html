<main class="create-instructor-page">
  <section class="instructor-form-panel">
    <header class="form-panel-header">
      <span class="section-eyebrow">Profilo personale</span>
      <h1>Modifica istruttore</h1>
      <p>Aggiorna dati profilo e tariffe professionali.</p>
    </header>

    <section *ngIf="loading()" class="form-message info-message">Caricamento dati istruttore...</section>

    <form *ngIf="!loading()" class="instructor-form" novalidate (submit)="modifyInstructor($event)">
      <section class="profile-upload-section" aria-label="Foto profilo">
        <input
          #profilePhotoInput
          type="file"
          class="visually-hidden"
          accept="image/png,image/jpeg"
          (change)="onProfilePhotoSelected($event)"
        />

        <button
          type="button"
          class="photo-upload-button"
          aria-label="Carica foto profilo"
          [class.invalid]="fieldError('profilePhoto')"
          (click)="openProfilePhotoPicker()"
        >
          <img
            *ngIf="profilePhotoPreviewUrl(); else uploadIcon"
            [src]="profilePhotoPreviewUrl()"
            alt="Anteprima foto profilo"
          />

          <ng-template #uploadIcon>
            <span class="material-symbols-outlined">add_a_photo</span>
          </ng-template>
        </button>

        <div>
          <h2>Foto profilo</h2>

          <button
            *ngIf="profilePhotoFile()"
            type="button"
            class="text-action text-action-danger"
            (click)="clearProfilePhoto()"
          >
            Ripristina foto
          </button>

          <p *ngIf="profilePhotoFile()" class="upload-file-name">
            {{ profilePhotoFile()?.name }}
          </p>

          <p *ngIf="fieldError('profilePhoto')" class="upload-error">
            {{ fieldError('profilePhoto') }}
          </p>
        </div>
      </section>

      <section class="form-grid" aria-label="Dati istruttore">
        <label class="form-field">
          <span>Nome</span>

          <input
            type="text"
            name="nome"
            maxlength="50"
            required
            [(ngModel)]="instructor.nome"
            [class.invalid]="fieldError('nome')"
            [attr.aria-invalid]="fieldError('nome') ? 'true' : 'false'"
            (input)="clearFieldError('nome')"
          />

          <small *ngIf="fieldError('nome')" class="field-error">
            {{ fieldError('nome') }}
          </small>
        </label>

        <label class="form-field">
          <span>Cognome</span>

          <input
            type="text"
            name="cognome"
            maxlength="50"
            required
            [(ngModel)]="instructor.cognome"
            [class.invalid]="fieldError('cognome')"
            [attr.aria-invalid]="fieldError('cognome') ? 'true' : 'false'"
            (input)="clearFieldError('cognome')"
          />

          <small *ngIf="fieldError('cognome')" class="field-error">
            {{ fieldError('cognome') }}
          </small>
        </label>

        <label class="form-field">
          <span>Email</span>

          <input
            type="email"
            name="email"
            maxlength="255"
            required
            [(ngModel)]="instructor.email"
            [class.invalid]="fieldError('email')"
            [attr.aria-invalid]="fieldError('email') ? 'true' : 'false'"
            (input)="clearFieldError('email')"
          />

          <small *ngIf="fieldError('email')" class="field-error">
            {{ fieldError('email') }}
          </small>
        </label>

        <label class="form-field">
          <span>Telefono</span>

          <input
            type="tel"
            name="telefono"
            inputmode="numeric"
            minlength="10"
            maxlength="10"
            pattern="[0-9]{10}"
            required
            [(ngModel)]="instructor.telefono"
            [class.invalid]="fieldError('telefono')"
            [attr.aria-invalid]="fieldError('telefono') ? 'true' : 'false'"
            (input)="clearFieldError('telefono')"
          />

          <small *ngIf="fieldError('telefono')" class="field-error">
            {{ fieldError('telefono') }}
          </small>
        </label>
      </section>

      <section class="rates-section" aria-label="Tariffe servizio">
        <h2>Tariffe servizio</h2>

        <div class="rates-grid">
          <label class="rate-field">
            <span>Tennis</span>

            <div
              class="rate-input"
              [class.invalid]="fieldError('costoOrarioTennis') || fieldError('tariffe')"
            >
              <input
                type="number"
                name="costoOrarioTennis"
                min="0"
                step="0.01"
                placeholder="0.00"
                [(ngModel)]="instructor.costoOrarioTennis"
                [attr.aria-invalid]="fieldError('costoOrarioTennis') || fieldError('tariffe') ? 'true' : 'false'"
                (keydown)="preventNegativeValue($event)"
                (input)="normalizeTennisRate($event); clearFieldError('costoOrarioTennis')"
              />
              <span>EUR/h</span>
            </div>

            <small *ngIf="fieldError('costoOrarioTennis')" class="field-error">
              {{ fieldError('costoOrarioTennis') }}
            </small>
          </label>

          <label class="rate-field">
            <span>Padel</span>

            <div
              class="rate-input"
              [class.invalid]="fieldError('costoOrarioPadel') || fieldError('tariffe')"
            >
              <input
                type="number"
                name="costoOrarioPadel"
                min="0"
                step="0.01"
                placeholder="0.00"
                [(ngModel)]="instructor.costoOrarioPadel"
                [attr.aria-invalid]="fieldError('costoOrarioPadel') || fieldError('tariffe') ? 'true' : 'false'"
                (keydown)="preventNegativeValue($event)"
                (input)="normalizePadelRate($event); clearFieldError('costoOrarioPadel')"
              />
              <span>EUR/h</span>
            </div>

            <small *ngIf="fieldError('costoOrarioPadel')" class="field-error">
              {{ fieldError('costoOrarioPadel') }}
            </small>
          </label>
        </div>

        <small *ngIf="fieldError('tariffe')" class="field-error">
          {{ fieldError('tariffe') }}
        </small>
      </section>

      <div *ngIf="submitError()" class="form-message error-message">
        {{ submitError() }}
      </div>

      <div *ngIf="submitSuccess()" class="form-message success-message">
        {{ submitSuccess() }}
      </div>

      <div class="form-actions">
        <button
          type="button"
          class="secondary-action"
          [disabled]="isSaving()"
          (click)="cancel()"
        >
          Annulla
        </button>

        <button
          type="submit"
          class="primary-action"
          [disabled]="isSaving()"
        >
          {{ isSaving() ? 'Salvataggio...' : 'Salva modifiche' }}
        </button>
      </div>
    </form>
  </section>
</main>
