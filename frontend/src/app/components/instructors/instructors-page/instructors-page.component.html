<main class="instructors-page">
  <header class="page-header">
    <div>
      <h1>Istruttori</h1>
      <p>Gestisci lo staff tecnico e le tariffe orarie.</p>
    </div>

    <button type="button" class="add-instructor-button" (click)="addInstructor()">
      <span class="material-symbols-outlined">add</span>
      <span>Aggiungi istruttore</span>
    </button>
  </header>

  <section *ngIf="loading" class="feedback-panel" aria-live="polite">
    <span class="material-symbols-outlined">progress_activity</span>
    <span>Caricamento istruttori...</span>
  </section>

  <section *ngIf="!loading && errorMessage" class="feedback-panel feedback-panel-error" aria-live="assertive">
    <div>
      <strong>Errore caricamento</strong>
      <p>{{ errorMessage }}</p>
    </div>

    <button type="button" class="retry-button" (click)="retry()">Riprova</button>
  </section>

  <section *ngIf="!loading && toggleError" class="feedback-panel feedback-panel-error" aria-live="assertive">
    <div>
      <strong>Operazione non riuscita</strong>
      <p>{{ toggleError }}</p>
    </div>
  </section>

  <section *ngIf="!loading && !errorMessage && !instructors.length" class="feedback-panel" aria-live="polite">
    <span class="material-symbols-outlined">groups</span>
    <span>Nessun istruttore presente.</span>
  </section>

  <section
    *ngIf="!loading && !errorMessage && instructors.length"
    class="instructors-grid"
    aria-label="Lista istruttori"
  >
    <app-instructor-card
      *ngFor="let instructor of instructors; trackBy: trackByInstructorId"
      [instructor]="instructor"
      [togglePending]="isToggling(instructor.id)"
      (editInstructor)="modifyInstructor($event)"
      (toggleInstructor)="onToggleInstructor($event)"
    />
  </section>
</main>
